[build]
  publish = "."

[forms]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://identity.netlify.com; script-src-attr 'none'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://identity.netlify.com https://innerturn.com.au https://www.innerturn.com.au; frame-src https://identity.netlify.com https://www.netlify.com; upgrade-insecure-requests"

[[headers]]
  for = "/dash.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/login.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/thanks.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/auth.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/login.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/dash.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/dash-boot.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/api/desk-board"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/api/desk-status"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/api/desk-state"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "https://inner-turn.netlify.app/*"
  to = "https://innerturn.com.au/:splat"
  status = 301
  force = true
