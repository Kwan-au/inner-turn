[build]
  # sync-partials writes the shared quote component into /
  command = "npm install && node scripts/sync-partials.mjs"
  publish = "."

[functions]
  directory = "netlify/functions"

[forms]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Permitted-Cross-Domain-Policies = "none"
    X-DNS-Prefetch-Control = "off"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://identity.netlify.com; script-src-attr 'none'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://identity.netlify.com https://innerturn.com.au https://www.innerturn.com.au; frame-src https://identity.netlify.com https://www.netlify.com https://www.google.com https://maps.google.com https://www.google.com.au; upgrade-insecure-requests"
    Cache-Control = "public, max-age=0, must-revalidate"

